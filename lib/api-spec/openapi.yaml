openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Grainily API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ads
    description: Ads/Publicités
  - name: admin
    description: Admin operations
  - name: stats
    description: Statistics
  - name: auth
    description: User authentication
  - name: categories
    description: Categories
  - name: units
    description: Units of measure
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ads:
    get:
      operationId: listAds
      tags: [ads]
      summary: List published ads
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: product
          in: query
          schema:
            type: string
        - name: quantity
          in: query
          schema:
            type: string
        - name: unit
          in: query
          schema:
            type: string
        - name: listingType
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ad"
    post:
      operationId: createAd
      tags: [ads]
      summary: Submit a new ad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdInput"
      responses:
        "201":
          description: Created ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"

  /ads/{id}:
    get:
      operationId: getAd
      tags: [ads]
      summary: Get ad by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List active categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      summary: List active units
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"

  /admin/ads:
    get:
      operationId: adminListAds
      tags: [admin]
      summary: Admin - list all ads (including pending)
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: All ads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ad"

  /admin/ads/{id}/status:
    patch:
      operationId: updateAdStatus
      tags: [admin]
      summary: Admin - update ad status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdStatusUpdate"
      responses:
        "200":
          description: Updated ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"

  /admin/ads/{id}:
    patch:
      operationId: updateAd
      tags: [admin]
      summary: Admin - edit any field of an ad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdUpdate"
      responses:
        "200":
          description: Updated ad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
    delete:
      operationId: deleteAd
      tags: [admin]
      summary: Admin - delete ad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/ads/bulk:
    post:
      operationId: adminBulkUpdateAds
      tags: [admin]
      summary: Admin - bulk approve / reject / delete ads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAdAction"
      responses:
        "200":
          description: Number of ads affected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"

  /admin/branding:
    get:
      operationId: getBranding
      tags: [admin]
      summary: Get current branding settings
      responses:
        "200":
          description: Branding settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"
    put:
      operationId: updateBranding
      tags: [admin]
      summary: Update branding settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Branding"
      responses:
        "200":
          description: Updated branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branding"

  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin]
      summary: Admin - list all categories
      responses:
        "200":
          description: All categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Admin - create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    put:
      operationId: adminUpdateCategory
      tags: [admin]
      summary: Admin - update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: adminDeleteCategory
      tags: [admin]
      summary: Admin - delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/units:
    get:
      operationId: adminListUnits
      tags: [admin]
      summary: Admin - list all units
      responses:
        "200":
          description: All units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: adminCreateUnit
      tags: [admin]
      summary: Admin - create unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Created unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /admin/units/{id}:
    put:
      operationId: adminUpdateUnit
      tags: [admin]
      summary: Admin - update unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "200":
          description: Updated unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: adminDeleteUnit
      tags: [admin]
      summary: Admin - delete unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /advertisements:
    get:
      operationId: listAdvertisements
      tags: [ads]
      summary: List active advertisements (public)
      responses:
        "200":
          description: List of active advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advertisement"

  /admin/advertisements:
    get:
      operationId: adminListAdvertisements
      tags: [admin]
      summary: Admin - list all advertisements
      responses:
        "200":
          description: All advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advertisement"
    post:
      operationId: adminCreateAdvertisement
      tags: [admin]
      summary: Admin - create advertisement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertisementInput"
      responses:
        "201":
          description: Created advertisement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advertisement"

  /admin/advertisements/reorder:
    post:
      operationId: adminReorderAdvertisements
      tags: [admin]
      summary: Admin - reorder advertisements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertisementReorderInput"
      responses:
        "200":
          description: Reordered advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Advertisement"

  /admin/advertisements/{id}:
    put:
      operationId: adminUpdateAdvertisement
      tags: [admin]
      summary: Admin - update advertisement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertisementInput"
      responses:
        "200":
          description: Updated advertisement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advertisement"
    delete:
      operationId: adminDeleteAdvertisement
      tags: [admin]
      summary: Admin - delete advertisement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/promotion-prices:
    get:
      operationId: adminListPromotionPrices
      tags: [admin]
      summary: Admin - list promotion prices
      responses:
        "200":
          description: All promotion prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionPrice"
    post:
      operationId: adminCreatePromotionPrice
      tags: [admin]
      summary: Admin - create promotion price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionPriceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPrice"

  /admin/promotion-prices/{id}:
    put:
      operationId: adminUpdatePromotionPrice
      tags: [admin]
      summary: Admin - update promotion price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionPriceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPrice"
    delete:
      operationId: adminDeletePromotionPrice
      tags: [admin]
      summary: Admin - delete promotion price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "409":
          description: Email already in use

  /auth/login:
    post:
      operationId: userLogin
      tags: [auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /plans:
    get:
      operationId: listPlans
      tags: [admin]
      summary: List active plans (public)
      responses:
        "200":
          description: Active plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /admin/plans:
    get:
      operationId: adminListPlans
      tags: [admin]
      summary: Admin - list all plans
      responses:
        "200":
          description: All plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: adminCreatePlan
      tags: [admin]
      summary: Admin - create plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /admin/plans/{id}:
    put:
      operationId: adminUpdatePlan
      tags: [admin]
      summary: Admin - update plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: adminDeletePlan
      tags: [admin]
      summary: Admin - delete plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/config:
    get:
      operationId: adminListConfig
      tags: [admin]
      summary: Admin - list all platform config (secrets masked)
      responses:
        "200":
          description: All config entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformConfig"

  /admin/config/{key}:
    put:
      operationId: adminUpdateConfig
      tags: [admin]
      summary: Admin - set a platform config value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformConfigInput"
      responses:
        "200":
          description: Updated config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfig"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin - dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: Admin - list admin users (root only)
      responses:
        "200":
          description: List of admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: adminCreateUser
      tags: [admin]
      summary: Admin - create admin user (root only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Created admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    put:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Admin - update admin user (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "200":
          description: Updated admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Admin - delete admin user (root only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/modes:
    get:
      operationId: adminGetModes
      tags: [admin]
      summary: Admin - get platform modes (boolean toggles)
      responses:
        "200":
          description: Platform modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformMode"

  /admin/modes/{key}:
    put:
      operationId: adminUpdateMode
      tags: [admin]
      summary: Admin - toggle a platform mode
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformModeInput"
      responses:
        "200":
          description: Updated mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMode"

  /admin/profile:
    get:
      operationId: getAdminProfile
      tags: [admin]
      summary: Admin - get own profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"
    put:
      operationId: updateAdminProfile
      tags: [admin]
      summary: Admin - update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfileInput"
      responses:
        "200":
          description: Updated admin profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfile"

  /auth/profile:
    put:
      operationId: updateUserProfile
      tags: [auth]
      summary: Update authenticated user profile (name, password, phone — not email)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /admin/members:
    get:
      operationId: adminListMembers
      tags: [admin]
      summary: Admin - list regular users (customers/merchants)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [customer, merchant, moderator]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberUser"
    post:
      operationId: adminCreateMember
      tags: [admin]
      summary: Admin - create a regular user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUserInput"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUser"

  /admin/members/{id}:
    put:
      operationId: adminUpdateMember
      tags: [admin]
      summary: Admin - update a regular user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUserInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUser"
    delete:
      operationId: adminDeleteMember
      tags: [admin]
      summary: Admin - delete a regular user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/members/{id}/suspend:
    patch:
      operationId: adminSuspendMember
      tags: [admin]
      summary: Root - suspend a user account, blocking login and active sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUser"

  /admin/members/{id}/unsuspend:
    patch:
      operationId: adminUnsuspendMember
      tags: [admin]
      summary: Root - reactivate a suspended user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUser"

  /admin/members/{id}/impersonate:
    post:
      operationId: adminImpersonateMember
      tags: [admin]
      summary: Root - issue a login token for a member to browse the app as them
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Impersonation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationResult"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Ad:
      type: object
      required: [id, title, location, product, category, status, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
